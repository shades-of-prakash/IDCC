# /etc/nginx/conf.d/default.conf (copied here by Dockerfile.nginx)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React / SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (note: your server logs say it listens on 4000)
    location /api/ {
        proxy_pass http://server:4000;  # service name "server" from docker-compose

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off; # good for SSE/streaming
    }
}
