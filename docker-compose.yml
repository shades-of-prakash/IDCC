services:
    mongo:
        image: mongo:7
        container_name: logiq-mongo
        restart: unless-stopped
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db

    server:
        build:
            context: .
            dockerfile: Dockerfile.server
        restart: unless-stopped
        env_file:
            - .env
        expose:
            - "4000"
        volumes:
            - ./uploads:/app/server/uploads
        depends_on:
            - mongo
            - judge-gcc-worker
            - judge-cpp-worker
            - judge-java-worker
            - judge-python-worker

    nginx:
        build:
            context: .
            dockerfile: Dockerfile.nginx
        container_name: logiq-nginx
        restart: unless-stopped
        ports:
            - "5173:80"
        depends_on:
            - server

    # ================= WORKERS =================
    judge-gcc-worker:
        build:
            context: .
            dockerfile: server/judge/workers/Dockerfile.judge-dup-gcc
        restart: unless-stopped
        volumes:
            - ./server/judge/work/gcc:/workspace
        command: ["sleep", "infinity"]

    judge-cpp-worker:
        build:
            context: .
            dockerfile: server/judge/workers/Dockerfile.judge-dup-cpp
        restart: unless-stopped
        volumes:
            - ./server/judge/work/cpp:/workspace
        command: ["sleep", "infinity"]

    judge-java-worker:
        build:
            context: .
            dockerfile: server/judge/workers/Dockerfile.judge-dup-java
        restart: unless-stopped
        volumes:
            - ./server/judge/work/java:/workspace
        command: ["sleep", "infinity"]

    judge-python-worker:
        build:
            context: .
            dockerfile: server/judge/workers/Dockerfile.judge-dup-python
        restart: unless-stopped
        volumes:
            - ./server/judge/work/python:/workspace
        command: ["sleep", "infinity"]

volumes:
    mongo_data:
